<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HOTEL_NAME}} | Digital Menu & Ordering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: {{PRIMARY_COLOR}};
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 120px;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hotel-brand {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .section-title {
            font-size: 1.2rem;
            margin: 20px 0 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex: 1;
            padding-right: 12px;
        }

        .item-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-price {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 700;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 12px;
        }

        .qty-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:active {
            transform: scale(0.85);
        }

        .qty-val {
            font-size: 0.95rem;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }

        .order-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .bar-inner {
            max-width: 500px;
            margin: 0 auto;
        }

        .service-type {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .type-btn {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .type-btn.active {
            background: var(--primary);
            color: #FFF;
            border-color: var(--primary);
        }

        .table-input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            color: #FFF;
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;
        }

        .checkout-btn {
            width: 100%;
            background: #25D366;
            color: #FFF;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .checkout-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <header>
        <div class="hotel-brand">{{HOTEL_NAME}}</div>
        <div style="font-size: 0.85rem; color: var(--text-sub);">Digital Menu</div>
    </header>

    <div class="container">
        <div class="section-title">Main Dishes & Meals</div>
        <div class="menu-item" data-name="Chicken & Chips" data-price="25000">
            <div class="item-info">
                <div class="item-name">Chicken & Chips</div>
                <div class="item-price">UGX 25,000</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
                <span class="qty-val">0</span>
                <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
            </div>
        </div>

        <div class="menu-item" data-name="Beef Stew & Rice" data-price="20000">
            <div class="item-info">
                <div class="item-name">Beef Stew & Rice</div>
                <div class="item-price">UGX 20,000</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
                <span class="qty-val">0</span>
                <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
            </div>
        </div>

        <div class="section-title">Drinks & Beverages</div>
        <div class="menu-item" data-name="Fresh Passion Juice" data-price="5000">
            <div class="item-info">
                <div class="item-name">Fresh Passion Juice</div>
                <div class="item-price">UGX 5,000</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty(this, -1)">-</button>
                <span class="qty-val">0</span>
                <button class="qty-btn" onclick="updateQty(this, 1)">+</button>
            </div>
        </div>
    </div>

    <div class="order-bar">
        <div class="bar-inner">
            <div class="service-type">
                <button class="type-btn active" onclick="setService('Dine-In / Table', this)">Dine-In</button>
                <button class="type-btn" onclick="setService('Room Service', this)">Room Service</button>
                <button class="type-btn" onclick="setService('Takeaway / Pickup', this)">Pickup</button>
            </div>
            <input type="text" id="locationInput" class="table-input" placeholder="Enter Table No. or Room No.">
            <button class="checkout-btn" onclick="sendOrder()">
                <span>Confirm Order via WhatsApp</span>
                <span id="totalDisplay">UGX 0</span>
            </button>
        </div>
    </div>

    <script>
        let cart = {};
        let serviceType = 'Dine-In / Table';
        const adminPhone = "{{ADMIN_PHONE}}";

        function updateQty(btn, change) {
            const item = btn.closest('.menu-item');
            const name = item.dataset.name;
            const price = parseInt(item.dataset.price);
            const valSpan = item.querySelector('.qty-val');

            let current = cart[name] ? cart[name].qty : 0;
            current = Math.max(0, current + change);

            if (current === 0) {
                delete cart[name];
            } else {
                cart[name] = { price, qty: current };
            }

            valSpan.textContent = current;
            calculateTotal();
        }

        function setService(type, btn) {
            serviceType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function calculateTotal() {
            let total = 0;
            for (let name in cart) {
                total += cart[name].price * cart[name].qty;
            }
            document.getElementById('totalDisplay').textContent = 'UGX ' + total.toLocaleString();
            return total;
        }

        function sendOrder() {
            const total = calculateTotal();
            if (total === 0) {
                alert('Please select at least one item to place an order.');
                return;
            }

            const location = document.getElementById('locationInput').value || 'Not specified';
            let summary = `*NEW DIGITAL ORDER - {{HOTEL_NAME}}*\n`;
            summary += `------------------------------\n`;
            summary += `*Service Type:* ${serviceType}\n`;
            summary += `*Table/Room/Note:* ${location}\n\n`;
            summary += `*Ordered Items:*\n`;

            for (let name in cart) {
                const item = cart[name];
                summary += `• ${name} x${item.qty} = UGX ${(item.price * item.qty).toLocaleString()}\n`;
            }

            summary += `------------------------------\n`;
            summary += `*TOTAL AMOUNT:* UGX ${total.toLocaleString()}\n\n`;
            summary += `Please confirm my order.`;

            const waUrl = `https://wa.me/${adminPhone}?text=${encodeURIComponent(summary)}`;
            window.location.href = waUrl;
        }
    </script>
</body>
</html>
