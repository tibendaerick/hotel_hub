<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HOTEL_NAME}} | Reservations & Bookings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: {{PRIMARY_COLOR}};
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px 16px;
        }

        .booking-card {
            max-width: 450px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .sub {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            color: #FFF;
            font-size: 0.95rem;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: #FFF;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="booking-card">
        <div class="title">{{HOTEL_NAME}}</div>
        <div class="sub">Direct Table & Room Reservation</div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="guestName" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Reservation Type</label>
            <select id="bookingType">
                <option value="Table Reservation">Table Reservation</option>
                <option value="Room Booking">Room Accommodation</option>
            </select>
        </div>

        <div class="form-group">
            <label>Date & Time</label>
            <input type="datetime-local" id="bookingTime">
        </div>

        <div class="form-group">
            <label>Number of Guests / Persons</label>
            <input type="number" id="guestCount" value="1" min="1">
        </div>

        <button class="submit-btn" onclick="sendBooking()">Submit Booking Request</button>
    </div>

    <script>
        const adminPhone = "{{ADMIN_PHONE}}";

        function sendBooking() {
            const name = document.getElementById('guestName').value;
            const type = document.getElementById('bookingType').value;
            const time = document.getElementById('bookingTime').value;
            const guests = document.getElementById('guestCount').value;

            if (!name || !time) {
                alert('Please enter your name and select date/time.');
                return;
            }

            let msg = `*NEW RESERVATION REQUEST - {{HOTEL_NAME}}*\n`;
            msg += `------------------------------\n`;
            msg += `*Guest Name:* ${name}\n`;
            msg += `*Type:* ${type}\n`;
            msg += `*Date/Time:* ${time}\n`;
            msg += `*Number of Persons:* ${guests}\n\n`;
            msg += `Please confirm availability.`;

            window.location.href = `https://wa.me/${adminPhone}?text=${encodeURIComponent(msg)}`;
        }
    </script>
</body>
</html>
