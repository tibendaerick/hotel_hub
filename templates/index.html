<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{HOTEL_NAME}} | Guest Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #111111;
            --card-border: #222222;
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, .btn-text, .brand-title {
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px 16px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 36px;
        }

        .logo {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FFFFFF;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        .brand-title {
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 0.88rem;
            color: var(--text-sub);
        }

        .nav-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .nav-btn:active {
            transform: scale(0.98);
            border-color: #FFFFFF;
            background: #1A1A1A;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            font-size: 1.4rem;
        }

        .btn-text {
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .arrow {
            font-size: 1.2rem;
            color: var(--text-sub);
        }

        footer {
            text-align: center;
            padding: 30px 16px 10px;
            font-size: 0.75rem;
            color: var(--text-sub);
            border-top: 1px solid var(--card-border);
            margin-top: 40px;
        }

        footer p:first-child {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero">
            <img src="{{LOGO_URL}}" class="logo" alt="{{HOTEL_NAME}}">
            <div class="brand-title">{{HOTEL_NAME}}</div>
            <div class="tagline">{{TAGLINE}}</div>
        </div>

        <div class="nav-stack">
            <a href="./menu.html" class="nav-btn">
                <div class="btn-left">
                    <span class="btn-icon">🍽️</span>
                    <span class="btn-text">Order Food & Drinks</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="./booking.html" class="nav-btn">
                <div class="btn-left">
                    <span class="btn-icon">🛎️</span>
                    <span class="btn-text">Reserve Table / Book Room</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="./inquiry.html" class="nav-btn">
                <div class="btn-left">
                    <span class="btn-icon">💬</span>
                    <span class="btn-text">Inquiries</span>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>

    <footer>
        <p>Hotel Digital Menu</p>
        <p>&copy; NexUp Technologies (U) 2023 - 2026</p>
        <p>All Rights Reserved.</p>
    </footer>

</body>
</html>
