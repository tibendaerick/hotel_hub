<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HOTEL_NAME}} | Guest Digital Hub</title>
    <style>
        :root {
            --primary: {{PRIMARY_COLOR}};
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-hover: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: #FFFFFF;
        }

        .hub-card {
            width: 100%;
            max-width: 410px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 32px 24px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-header {
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }

        .brand-logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            background: #FFFFFF;
        }

        .verified-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: var(--primary);
            color: #FFF;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid #1E293B;
        }

        .hotel-title {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .hotel-tagline {
            font-size: 0.9rem;
            color: #94A3B8;
            font-weight: 400;
            line-height: 1.4;
        }

        .action-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 18px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 6px;
            background: var(--primary);
        }

        .btn-action:active {
            transform: scale(0.97);
            background: var(--card-hover);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .btn-text {
            font-size: 1.05rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .chevron-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            font-size: 0.78rem;
            color: #64748B;
            line-height: 1.5;
        }

        .footer p:first-child {
            color: #94A3B8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="hub-card">
        <header class="brand-header">
            <div class="avatar-wrapper">
                <img src="{{LOGO_URL}}" alt="{{HOTEL_NAME}} Logo" class="brand-logo" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?w=150&auto=format&fit=crop'">
                <div class="verified-badge">✓</div>
            </div>
            <h1 class="hotel-title">{{HOTEL_NAME}}</h1>
            <p class="hotel-tagline">{{TAGLINE}}</p>
        </header>

        <main class="action-grid">
            <a href="{{MENU_URL}}" class="btn-action">
                <div class="btn-left">
                    <div class="btn-icon-box">🍽️</div>
                    <span class="btn-text">Order Food & Drinks</span>
                </div>
                <div class="chevron-circle">&rarr;</div>
            </a>
            <a href="{{TABLE_URL}}" class="btn-action">
                <div class="btn-left">
                    <div class="btn-icon-box">🍷</div>
                    <span class="btn-text">Reserve a Table</span>
                </div>
                <div class="chevron-circle">&rarr;</div>
            </a>
            <a href="{{ROOM_URL}}" class="btn-action">
                <div class="btn-left">
                    <div class="btn-icon-box">🛏️</div>
                    <span class="btn-text">Book a Room / Inquiry</span>
                </div>
                <div class="chevron-circle">&rarr;</div>
            </a>
        </main>

        <footer class="footer">
            <p>Hotel Digital Hub</p>
            <p>&copy; NexUp Technologies(U) 2026</p>
            <p>All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
