<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HOTEL_NAME}} | Guest Digital Hub</title>
    <link rel="stylesheet" href="../../assets/css/hub.css">
</head>
<body>
    <div class="hub-container">
        <header class="header">
            <img src="{{LOGO_URL}}" alt="{{HOTEL_NAME}} Logo" class="brand-logo">
            <h1 class="hotel-title">{{HOTEL_NAME}}</h1>
            <p class="hotel-tagline">{{TAGLINE}}</p>
        </header>
        
        <main class="action-grid">
            <a href="{{MENU_URL}}" class="btn-action">
                <div class="btn-left">
                    <span class="btn-icon">🍽️</span>
                    <span>Order Food & Drinks</span>
                </div>
                <span class="chevron">&rarr;</span>
            </a>
            <a href="{{TABLE_URL}}" class="btn-action">
                <div class="btn-left">
                    <span class="btn-icon">🍷</span>
                    <span>Reserve a Table</span>
                </div>
                <span class="chevron">&rarr;</span>
            </a>
            <a href="{{ROOM_URL}}" class="btn-action">
                <div class="btn-left">
                    <span class="btn-icon">🛏️</span>
                    <span>Book a Room / Inquiry</span>
                </div>
                <span class="chevron">&rarr;</span>
            </a>
        </main>

        <footer class="footer">
            <p>Hotel Digital Hub</p>
            <p>©️ NexUp Technologies 2026</p>
            <p>All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
